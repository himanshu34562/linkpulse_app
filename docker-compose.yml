services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: linkpulse
      POSTGRES_PASSWORD: linkpulse
      POSTGRES_DB: linkpulse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkpulse"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Not used until stage 3 (caching), but provisioned now so the stack is stable.
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
